apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - mongodb-statefulset.yaml

patches:
  - path: service-account-patch.yaml
  # dev: 2 nodes pequenos nao comportam o pod velho e o novo juntos.
  # RabbitMQ do dev e StatefulSet sem TLS (porta 5672). Recursos sao valores iniciais.
  - target:
      kind: Deployment
      name: jlapp-pagamento-deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jlapp-pagamento-deployment
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        template:
          spec:
            containers:
              - name: jlapp-pagamento
                env:
                  - name: SPRING_RABBITMQ_SSL_ENABLED
                    value: "false"
                resources:
                  requests:
                    cpu: 100m
                    memory: 320Mi
                  limits:
                    cpu: 1000m
                    memory: 640Mi
  - target:
      kind: Deployment
      name: jlapp-pagamento-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          value: dev
  - target:
      kind: Deployment
      name: jlapp-pagamento-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: jlapp-pagamento-deployment
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
