apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: jlapp-pagamento-deployment
  namespace: default
spec:
  minReplicas: 1
  maxReplicas: 5
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jlapp-pagamento-deployment
  targetCPUUtilizationPercentage: 80
status:
  currentReplicas: 2
  desiredReplicas: 2
 